name: Build & Release (Maven only)

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: ./gradlew build publish
        env:
          RELEASE: True
          MAVEN_URL: ${{ secrets.LT_MAVEN_RELEASES_URL }}
          MAVEN_USERNAME: ${{ secrets.LT_MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.LT_MAVEN_PASS }}
